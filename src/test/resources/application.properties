spring.datasource.url=jdbc:h2:mem:./db/db_cgb_test;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sio
spring.datasource.password=slam
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.datasource.type=com.zaxxer.hikari.HikariDataSource
# spring.datasource.hikari.auto-commit=true
# spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.ddl-auto=create-drop
# Initialisation / exécutions des scripts
spring.sql.init.mode = always
# Déférer l\u2019exécution des scripts après hibernate
spring.jpa.defer-datasource-initialization=true

spring.h2.console.settings.web-allow-others=true
spring.h2.console.enabled=true
spring.error.whitelabel.enabled=true
spring.h2.console.path=/console
spring.datasource.continue-on-error=true
spring.hibernate.show_sql=true



